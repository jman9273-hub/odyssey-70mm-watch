# For the odyssey-70mm-watch repo.
# Paste as the contents of: .github/workflows/monitor.yml

name: odyssey-70mm-watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: showtime-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Watch The Odyssey (IMAX 70mm)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_LABEL: "Odyssey IMAX 70mm - Lincoln Sq"
          DATE_URL_TEMPLATE: "https://www.amctheatres.com/movie-theatres/new-york-city/amc-lincoln-square-13/showtimes?date={date}"
          REQUEST_DELAY: "2"
        run: python monitor.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "showtime-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "chore: update seen showtimes [skip ci]" && git push)
